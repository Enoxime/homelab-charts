{{- if and .Values.persistence.cache.enabled (not .Values.persistence.cache.claimName) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "searxng.fullname" . }}-cache
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
    {{- with .Values.persistence.cache.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.persistence.cache.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.cache.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.cache.size | quote }}
  {{- with .Values.persistence.cache.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
